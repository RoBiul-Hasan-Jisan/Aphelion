<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060c"/>
      <stop offset="100%" stop-color="#0b0d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1120" y1="0" x2="1120" y2="360"/>
  </g>

  <!-- orbit rings around a focal point on the right -->
  <g transform="translate(1000,180)">
    <ellipse cx="0" cy="0" rx="230" ry="90" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="170" ry="66" fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="110" ry="42" fill="none" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="10" fill="#f5c94a"/>
    <circle cx="230" cy="0" r="6" fill="#60a5fa"/>
    <circle cx="-95" cy="-36" r="4" fill="#c084fc"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(80,120)">
    <circle cx="24" cy="24" r="24" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="24" cy="0" r="5" fill="#a855f7"/>
    <circle cx="24" cy="48" r="5" fill="#3b82f6"/>
    <path d="M24 10 L38 40 L30 40 L24 26 L18 40 L10 40 Z" fill="url(#accent)"/>
  </g>

  <text x="150" y="145" font-family="Space Grotesk, Arial, sans-serif" font-size="64" font-weight="700" fill="#f4f4f8">Aphelion</text>
  <text x="82" y="195" font-family="Inter, Arial, sans-serif" font-size="19" fill="#9a9ab0">Interactive laboratory for orbital mechanics &amp; projectile motion</text>

  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#7c7c94">
    <text x="82" y="240">6 integrators</text>
    <text x="210" y="240">·</text>
    <text x="225" y="240">2 simulators</text>
    <text x="355" y="240">·</text>
    <text x="370" y="240">real-time canvas rendering</text>
  </g>
</svg>
